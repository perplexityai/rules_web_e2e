caches:
  - name: bazel
    cache_key:
      - rules-web-e2e-bazel-v2
      - agent: pipeline
      - agent: os
      - agent: arch
      - env: USE_BAZEL_VERSION
      - agent: step
        fallback_limit: true
      - env: BUILDKITE_COMMIT
    target_paths:
      - /tmp/rules-web-e2e-ci/repository
      - /tmp/rules-web-e2e-ci/disk
