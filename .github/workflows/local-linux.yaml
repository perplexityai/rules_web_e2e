name: local Linux browsers

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: local-linux-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  local-browser:
    name: local browsers / ${{ matrix.os }} / Bazel ${{ matrix.bazel }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm]
        bazel: ['8.6.0', '9.2.0']
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
      LOCAL_HOST_SENTINEL: must-not-reach-browser
      LOCAL_BROWSER_CACHE_CONFIGURED: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: local-linux-${{ matrix.os }}-${{ matrix.bazel }}
      - name: Allow user namespaces on the disposable runner
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Identify the local execution environment
        run: |
          platform_id=$({
            printf '%s\n' "$ImageOS" "$ImageVersion" 'userns-enabled-v1'
            uname -srmv
            LC_ALL=C grep -E '^(vendor_id|model name|microcode|flags|Features|CPU implementer|CPU architecture|CPU variant|CPU part|CPU revision)[[:space:]]*:' /proc/cpuinfo | LC_ALL=C sort -u
          } | sha256sum | cut -d ' ' -f 1)
          echo "LOCAL_BROWSER_PLATFORM=$platform_id" >> "$GITHUB_ENV"
      - name: Test local E2E, components, video, VRT, lifecycle, and caching
        run: node e2e-tests/run.ts local "$RUNNER_TEMP/local-browser"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: local-browser-${{ matrix.os }}-${{ matrix.bazel }}
          path: |
            ${{ runner.temp }}/local-browser/results/
