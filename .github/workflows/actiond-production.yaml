name: actiond production VRT

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  vrt:
    name: VRT tests (Linux amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      USE_BAZEL_VERSION: '9.2.0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: actiond-linux-amd64
      - name: Prepare production suites and caller runtime
        run: |
          work="$RUNNER_TEMP/actiond-production"
          ACTIOND_SKIP_WORKER_SOURCE=1 bash tests/actiond/prepare.sh "$work"
          node tests/actiond/prepare-public.mjs "$work"
      - name: Materialize the published worker supervisor
        run: |
          work="$RUNNER_TEMP/actiond-production"
          bazelisk run --script_path="$work/run-web-e2e" //worker:runner
      - name: Enable KVM and vhost-vsock
        run: |
          test -c /dev/kvm
          if [[ ! -e /dev/vhost-vsock ]]; then sudo modprobe vhost_vsock; fi
          test -c /dev/vhost-vsock
          # Finish device rules before chmod so udev cannot reset access later.
          sudo udevadm settle
          sudo chmod a+rw /dev/kvm /dev/vhost-vsock
          test -r /dev/vhost-vsock && test -w /dev/vhost-vsock
          stat -c "DEVICE before-suite %F %a %u:%g %i" /dev/vhost-vsock
      - name: Capture and compare in the VM
        env:
          ACTIOND_BAZEL: bazelisk
        run: |
          work="$RUNNER_TEMP/actiond-production"
          "$work/run-web-e2e" --log-dir="$work/supervisor" exec -- bash tests/actiond/run-public-actiond.sh "$work"
          stat -c "DEVICE after-suite %F %a %u:%g %i" /dev/vhost-vsock
      - name: Run the documented React preset example
        working-directory: examples/react
        run: |
          stat -c "DEVICE before-launcher %F %a %u:%g %i" /dev/vhost-vsock
          mkdir -p .web-e2e
          bazelisk run --script_path="$PWD/.web-e2e/run" @rules_web_e2e//worker:runner
          stat -c "DEVICE after-launcher %F %a %u:%g %i" /dev/vhost-vsock
          .web-e2e/run --bazel=bazelisk doctor
          .web-e2e/run --bazel=bazelisk test //:e2e_test //:component_test //:native_config_test //:visual_test //:component_visual_test //:native_visual_test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: actiond-production-vrt
          path: |
            ${{ runner.temp }}/actiond-production/results/
            ${{ runner.temp }}/actiond-production/supervisor/
            examples/react/.web-e2e/logs/
            examples/react/bazel-testlogs/
