name: actiond macOS VRT build smoke

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-smoke:
    name: VRT build smoke (macOS ARM64)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: actiond-macos-arm64
      # Hosted Macs cannot boot nested VMs. Build the real VRT inputs and worker.
      - name: Build ARM64 runtime, signed worker, and VRT inputs
        run: bash tests/actiond/run-macos-arm64.sh "$RUNNER_TEMP/actiond-macos" --build-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: actiond-macos-vrt-build
          path: ${{ runner.temp }}/actiond-macos/worker-build.log
