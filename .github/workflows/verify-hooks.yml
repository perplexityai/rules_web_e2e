name: Verify Commit Hooks

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-hooks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Commit Messages
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          commits=$(git rev-list "$BASE_SHA"..HEAD)

          title_file=$(mktemp)
          printf '%s\n' "$PR_TITLE" > "$title_file"
          pnpm exec lefthook run commit-msg "$title_file" --force
          rm "$title_file"

          for commit in $commits; do
            echo "Validating commit: $(git log -1 --oneline $commit)"
            msg_file=$(mktemp)
            git log -1 --format=%B "$commit" > "$msg_file"
            pnpm exec lefthook run commit-msg "$msg_file" --force
            rm "$msg_file"
          done
