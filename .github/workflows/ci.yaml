name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bazel-test:
    name: bazel ${{ matrix.bazel }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        bazel: ['9.2.0', '8.6.0']
        os: [ubuntu-latest, macos-latest]
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}-bazel${{ matrix.bazel }}
          repository-cache: true
      - name: Build
        run: bazelisk build //...
      - name: Test
        run: bazelisk test //...
      - name: Build and test the BCR consumer
        working-directory: bcr_test
        run: |
          bazelisk build @rules_web_e2e//:distribution //...
          bazelisk test //...

  host-browser:
    name: host browser tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
      DOCKER_HOST: tcp://127.0.0.1:1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Provision version-matched host browsers before tests
        run: |
          version=$(node -p 'require("./package.json").devDependencies.playwright')
          npx --yes "playwright@$version" install --with-deps chromium
      - name: Run host browser suites without Docker
        working-directory: examples/react
        run: bazelisk test //:e2e_test //:component_test //:remote_integration_test //:native_config_test --test_output=errors

  component-vrt:
    name: VRT tests (Linux amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Preload declared images and verify credential-free browser startup
        run: |
          bazelisk build //runtime:images
          manifest="$(bazelisk info bazel-bin)/runtime/images.json"
          jq -r '.images[] | [.image, (.platform // "")] | @tsv' "$manifest" |
          while IFS="$(printf '\t')" read -r image platform; do
            if [ -n "$platform" ]; then
              docker pull --platform "$platform" "$image"
            else
              docker pull "$image"
            fi
          done
          bazelisk test //runtime:preload_browser_test --test_output=errors
      - name: Verify generated capture bounds and pixels
        run: bazelisk test //runtime:capture_browser_test --test_output=errors
      - name: Run visual tests and container isolation coverage
        working-directory: examples/react
        run: bazelisk test //:visual_test //:component_visual_test //:native_visual_test //:network_isolation_test --test_output=errors
      - name: Upload visual test artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-tests
          path: examples/react/bazel-testlogs/
