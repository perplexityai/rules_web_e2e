name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bazel-test:
    name: bazel ${{ matrix.bazel }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        bazel: ["9.0.0", "8.6.0"]
        os: [ubuntu-latest, macos-latest]
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}-bazel${{ matrix.bazel }}
          repository-cache: true
      - name: Build
        run: bazelisk build //...
      - name: Test
        run: bazelisk test //...
      - name: Build and test the BCR consumer
        working-directory: bcr_test
        run: |
          bazelisk build @rules_web_e2e//:distribution //...
          bazelisk test //...
